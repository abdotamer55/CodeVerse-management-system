<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="markBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>

    <linearGradient id="markCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="markIndigoViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="markStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="markSubtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#markBgGrad)" stroke="url(#markStrokeGrad)" stroke-width="1.8"/>

  <path d="M14 32 H50 M32 14 V50" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" opacity="0.45"/>

  <!-- Left Code Bracket "<" -->
  <path d="M24 23 L15 32 L24 41" 
        stroke="url(#markCyanBlue)" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#markGlow)"/>

  <!-- Right Code Bracket ">" -->
  <path d="M40 23 L49 32 L40 41" 
        stroke="url(#markIndigoViolet)" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#markGlow)"/>

  <!-- Isometric Slash / Forward Ray "/" -->
  <path d="M36 20 L28 44" 
        stroke="#00f5ff" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        opacity="0.9"
        filter="url(#markSubtleGlow)"/>

  <!-- Energy Core Orbital Node -->
  <circle cx="32" cy="32" r="3.2" fill="#ffffff" filter="url(#markGlow)"/>
  <circle cx="32" cy="32" r="5.5" stroke="#00f5ff" stroke-width="1.2" opacity="0.75"/>

  <circle cx="15" cy="32" r="1.6" fill="#00f5ff"/>
  <circle cx="49" cy="32" r="1.6" fill="#a855f7"/>
</svg>
