<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M18 22 L10 30 L18 38" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M42 22 L50 30 L42 38" stroke="url(#grad1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="30" cy="30" r="5" fill="url(#grad2)" filter="url(#glow)"/>
    <path d="M25 43 L35 17" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- Text Brand Arabic & English -->
  <g transform="translate(85, 48)">
    <text x="0" y="0" font-family="'Cairo', 'Tajawal', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">CodeVerse</text>
    <text x="140" y="-1" font-family="'Cairo', 'Tajawal', sans-serif" font-size="19" font-weight="700" fill="#38bdf8">كودفيرس</text>
    <text x="2" y="16" font-family="'Cairo', 'Tajawal', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="1">منصة تعليم البرمجيات والتقنية</text>
  </g>
</svg>